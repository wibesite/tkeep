<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111411;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b201b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#grad3)" />
  <circle cx="900" cy="360" r="240" fill="#d8e2b6" opacity="0.09" filter="url(#glow3)" />
  <circle cx="180" cy="1620" r="320" fill="#83a977" opacity="0.07" filter="url(#glow3)" />

  <rect x="0" y="0" width="1080" height="200" fill="#000000" opacity="0.30" />
  <rect x="0" y="1720" width="1080" height="200" fill="#000000" opacity="0.30" />

  <text x="60" y="120" font-family="Inter, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">TKEEP<span fill="#d8e2b6">.</span></text>

  <text x="60" y="500" font-family="Inter, sans-serif" font-size="82" font-weight="900" fill="#ffffff" line-height="1.05" letter-spacing="-0.03em">
