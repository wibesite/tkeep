  <text x="120" y="1195" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Поиск по вашей базе знаний</text>
  <text x="120" y="1250" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Ответы с указанием источника</text>
  <text x="120" y="1305" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Интеграция с CRM</text>

