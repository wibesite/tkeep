  <text x="120" y="970" font-family="Inter, sans-serif" font-size="112" font-weight="900" fill="#d8e2b6" letter-spacing="-0.04em">от 200</text>
  <text x="660" y="970" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#b9ca83">BYN</text>

  <line x1="120" y1="1060" x2="900" y2="1060" stroke="#333a32" stroke-width="1" />

