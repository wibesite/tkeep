<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111411;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b201b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#grad1)" />

  <!-- Decorative circles -->
  <circle cx="880" cy="320" r="220" fill="#d8e2b6" opacity="0.10" filter="url(#glow)" />
  <circle cx="200" cy="1580" r="300" fill="#83a977" opacity="0.08" filter="url(#glow)" />
  <circle cx="920" cy="1700" r="140" fill="#e4e8cf" opacity="0.06" filter="url(#glow)" />

  <!-- Safe zone top/bottom hints (optional, can be removed) -->
  <rect x="0" y="0" width="1080" height="200" fill="#000000" opacity="0.30" />
  <rect x="0" y="1720" width="1080" height="200" fill="#000000" opacity="0.30" />

  <!-- Logo -->
  <text x="60" y="120" font-family="Inter, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">TKEEP<span fill="#d8e2b6">.</span></text>

  <!-- Hook -->
  <text x="60" y="520" font-family="Inter, sans-serif" font-size="78" font-weight="900" fill="#ffffff" line-height="1.05" letter-spacing="-0.03em">
    Сайт за 100<span fill="#d8e2b6"> BYN</span>?
  </text>
  <text x="60" y="610" font-family="Inter, sans-serif" font-size="78" font-weight="900" fill="#d8e2b6" line-height="1.05" letter-spacing="-0.03em">
    Да, лендинг под ключ.
  </text>

  <!-- Sub -->
  <text x="60" y="700" font-family="Inter, sans-serif" font-size="34" font-weight="500" fill="#b9ca83" line-height="1.4">
    Посадочная страница, адаптив, форма заявки — запуск за 2–3 недели.
  </text>

  <!-- Price card -->
  <rect x="60" y="820" width="960" height="340" rx="32" fill="#1b201b" stroke="#d8e2b6" stroke-width="2" />
  <text x="120" y="900" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Цена</text>
  <text x="120" y="980" font-family="Inter, sans-serif" font-size="110" font-weight="900" fill="#d8e2b6" letter-spacing="-0.04em">от 100</text>
  <text x="640" y="980" font-family="Inter, sans-serif" font-size="46" font-weight="700" fill="#b9ca83">BYN</text>

  <!-- Divider -->
  <line x1="120" y1="1060" x2="900" y2="1060" stroke="#333a32" stroke-width="1" />

  <!-- Features -->
  <text x="120" y="1130" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Что внутри:</text>
  <text x="120" y="1180" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Дизайн и вёрстка под ключ</text>
  <text x="120" y="1230" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Адаптив и формы заявок</text>
  <text x="120" y="1280" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Запуск за 2–3 недели</text>

  <!-- CTA -->
  <rect x="60" y="1420" width="960" height="140" rx="22" fill="#d8e2b6" />
  <text x="160" y="1510" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#111411">Обсучить лендинг →</text>
  <text x="700" y="1510" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#111411">t.me/tkeepru</text>

  <!-- Footer -->
  <text x="60" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">hello@tkeep.ru</text>
  <text x="560" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">tkeep.ru</text>
  <text x="860" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">Ссылка в био</text>
</svg>