<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111411;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b201b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#grad5)" />
  <circle cx="920" cy="380" r="250" fill="#d8e2b6" opacity="0.09" filter="url(#glow5)" />
  <circle cx="200" cy="1640" r="330" fill="#83a977" opacity="0.07" filter="url(#glow5)" />

  <rect x="0" y="0" width="1080" height="200" fill="#000000" opacity="0.30" />
  <rect x="0" y="1720" width="1080" height="200" fill="#000000" opacity="0.30" />

  <text x="60" y="120" font-family="Inter, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">TKEEP<span fill="#d8e2b6">.</span></text>

  <text x="60" y="500" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="#ffffff" line-height="1.05" letter-spacing="-0.03em">
    Сайт не ломается —
  </text>
  <text x="60" y="600" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="#d8e2b6" line-height="1.05" letter-spacing="-0.03em">
    мы следим.
  </text>

  <text x="60" y="690" font-family="Inter, sans-serif" font-size="32" font-weight="500" fill="#b9ca83" line-height="1.4">
    Техподдержка, мониторинг, обновления и развитие — сайт работает, вы развиваете бизнес.
  </text>

  <rect x="60" y="800" width="960" height="360" rx="34" fill="#1b201b" stroke="#d8e2b6" stroke-width="2" />
  <text x="120" y="880" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Цена</text>
  <text x="120" y="970" font-family="Inter, sans-serif" font-size="112" font-weight="900" fill="#d8e2b6" letter-spacing="-0.04em">от 300</text>
  <text x="660" y="970" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#b9ca83">BYN / мес</text>

  <line x1="120" y1="1060" x2="900" y2="1060" stroke="#333a32" stroke-width="1" />

  <text x="120" y="1140" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#ffffff">В поддержке:</text>
  <text x="120" y="1195" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Исправления и обновления</text>
  <text x="120" y="1250" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Мониторинг и резервные копии</text>
  <text x="120" y="1305" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#b9ca83">• Планирование улучшений</text>

  <rect x="60" y="1440" width="960" height="140" rx="22" fill="#d8e2b6" />
  <text x="160" y="1530" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#111411">Заказать поддержку →</text>
  <text x="680" y="1530" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#111411">t.me/tkeepru</text>

  <text x="60" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">hello@tkeep.ru</text>
  <text x="560" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">tkeep.ru</text>
  <text x="860" y="1820" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#8a9289">Ссылка в био</text>
</svg>