<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TKEEP — промо-серия</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #101310; color: #e4e8cf; font-family: system-ui, -apple-system, sans-serif; padding: clamp(20px, 4vw, 64px); }
  h1 { max-width: 900px; font-size: clamp(32px, 5vw, 68px); line-height: .95; letter-spacing: -.05em; margin-bottom: 40px; }
  h1 span { color: #d8e2b6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
  .card { background: #171c17; border: 1px solid #333a32; overflow: hidden; aspect-ratio: 9 / 16; width: 100%; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note { max-width: 780px; margin-top: 40px; font-size: 14px; color: #8a9289; line-height: 1.7; }
  .note b { color: #d8e2b6; }
</style>
</head>
<body>
  <h1>Промо-серия<br /><span>TKEEP / 01—05</span></h1>
  <div class="grid">
    <div class="card"><img src="card1-landing.png" alt="Лендинг" /></div>
    <div class="card"><img src="card2-bot.png" alt="Telegram-бот" /></div>
    <div class="card"><img src="card3-ai.png" alt="AI и RAG" /></div>
    <div class="card"><img src="card4-shop.png" alt="Интернет-магазин" /></div>
    <div class="card"><img src="card5-support.png" alt="Поддержка" /></div>
  </div>
  <div class="note">
    <b>Формат:</b> PNG 1080×1920. Главный текст и CTA размещены внутри безопасной зоны TikTok.<br />
    <b>Исходники:</b> SVG лежат рядом. После правок запустите <code>npm run promo:render</code>.<br />
    <b>Контакты:</b> @tkeepru · tkeep.ru
  </div>
</body>
</html>
