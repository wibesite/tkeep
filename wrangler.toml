name = "tkeep"
main = "src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true
preview_urls = true

# The domain must already be active in the same Cloudflare account.
routes = [
  { pattern = "tkeep.ru", custom_domain = true },
  { pattern = "www.tkeep.ru", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[observability]
enabled = true
